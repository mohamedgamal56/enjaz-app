<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="إنجاز - تطبيق إدارة المهام والأهداف الحياتية أوفلاين">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="إنجاز">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>إنجاز | Enjaz</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #FAFAF9;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Cairo', sans-serif;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #0D9488;
      font-size: 20px;
      font-weight: 600;
    }
    .spinner {
      border: 4px solid rgba(13, 148, 136, 0.2);
      border-top: 4px solid #0D9488;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>جارٍ تشغيل إنجاز...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
