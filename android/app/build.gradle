plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.enjaz.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.enjaz.app"
        minSdk = 24
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keystoreFile = file("enjaz-release-key.jks")
            if (keystoreFile.exists()) {
                storeFile = keystoreFile
                storePassword = System.getenv("ENJAZ_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("ENJAZ_KEY_ALIAS") ?: "enjaz_release_key"
                keyPassword = System.getenv("ENJAZ_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            def keystoreFile = file("enjaz-release-key.jks")
            if (keystoreFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                // Never silently distribute a release with an unrelated debug key.
                if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }) {
                    throw new GradleException("Release keystore missing: configure the permanent Enjaz signing key")
                }
            }
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

flutter {
    source = "../.."
}
