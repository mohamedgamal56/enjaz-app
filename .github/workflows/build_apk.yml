name: Build Flutter APK

on:
  push:
    branches: [ main, master, 'fix/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner for Drift Database
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run unit tests
        run: flutter test

      - name: Configure Release Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ENJAZ_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ENJAZ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ENJAZ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ENJAZ_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Required release signing secrets are missing! Please configure ENJAZ_RELEASE_KEYSTORE_BASE64, ENJAZ_KEYSTORE_PASSWORD, ENJAZ_KEY_ALIAS, and ENJAZ_KEY_PASSWORD in GitHub Repository Secrets."
            exit 1
          fi
          echo "Decoding release keystore from GitHub Secret..."
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/enjaz-release-key.jks

      - name: Build Release APK (arm64 only)
        if: github.event_name != 'pull_request'
        env:
          ENJAZ_KEYSTORE_PASSWORD: ${{ secrets.ENJAZ_KEYSTORE_PASSWORD }}
          ENJAZ_KEY_ALIAS: ${{ secrets.ENJAZ_KEY_ALIAS }}
          ENJAZ_KEY_PASSWORD: ${{ secrets.ENJAZ_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Prepare APK
        if: github.event_name != 'pull_request'
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '[:space:]')
          APK_NAME="enjaz-v${VERSION}-arm64.apk"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$APK_NAME"
          cp "$APK_NAME" enjaz-app-arm64.apk

      - name: Verify APK Signature Fingerprint
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(which apksigner 2>/dev/null || find /usr/local/lib/android/sdk/build-tools -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          fi
          
          echo "Using apksigner tool: $APKSIGNER"
          EXPECTED_SHA256=$(cat android/expected_cert_sha256.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          ACTUAL_RAW=$("$APKSIGNER" verify --print-certs "$APK_NAME" | grep -i "certificate SHA-256 digest:" | head -n 1 | awk '{print $NF}')
          ACTUAL_SHA256=$(echo "$ACTUAL_RAW" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          
          echo "Expected SHA-256: $EXPECTED_SHA256"
          echo "Actual   SHA-256: $ACTUAL_SHA256"
          
          if [ -z "$ACTUAL_SHA256" ] || [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "::error::APK signature verification failed! Expected $EXPECTED_SHA256 but got $ACTUAL_SHA256"
            exit 1
          fi
          echo "✅ APK signature verified successfully: $ACTUAL_RAW"

      - name: Upload APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
