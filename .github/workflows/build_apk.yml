name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner for Drift Database
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run unit tests
        run: flutter test

      - name: Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ENJAZ_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ENJAZ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ENJAZ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ENJAZ_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/enjaz-release-key.jks
          else
            echo "Generating permanent fixed release keystore..."
            keytool -genkeypair -v -keystore android/app/enjaz-release-key.jks \
              -alias "${KEY_ALIAS:-enjaz_release_key}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-enjaz_app_2026_release_secure_key}" \
              -keypass "${KEY_PASSWORD:-enjaz_app_2026_release_secure_key}" \
              -dname "CN=Enjaz, OU=Enjaz Mobile, O=Enjaz, L=Cairo, S=Cairo, C=EG"
            echo "::notice title=ENJAZ_RELEASE_KEYSTORE_BASE64::$(base64 -w 0 android/app/enjaz-release-key.jks)"
          fi

      - name: Build Release APK (Split per ABI)
        env:
          ENJAZ_KEYSTORE_PASSWORD: ${{ secrets.ENJAZ_KEYSTORE_PASSWORD || 'enjaz_app_2026_release_secure_key' }}
          ENJAZ_KEY_ALIAS: ${{ secrets.ENJAZ_KEY_ALIAS || 'enjaz_release_key' }}
          ENJAZ_KEY_PASSWORD: ${{ secrets.ENJAZ_KEY_PASSWORD || 'enjaz_app_2026_release_secure_key' }}
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Prepare APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk enjaz-app-arm64.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk enjaz-app.apk
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk enjaz-app-armeabi-v7a.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enjaz-app-apk
          path: enjaz-app*.apk
