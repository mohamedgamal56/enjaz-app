name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner for Drift Database
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APKs (Release & Debug)
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Prepare APKs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/enjaz-release.apk
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/enjaz-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: enjaz-apk
          path: |
            build/app/outputs/flutter-apk/enjaz-release.apk
            build/app/outputs/flutter-apk/enjaz-debug.apk
