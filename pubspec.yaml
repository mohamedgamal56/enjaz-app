name: enjaz
description: "إنجاز - تطبيق إدارة المهام والأهداف الحياتية أوفلاين بالكامل"
publish_to: "none"
version: 1.0.6+7

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  record: ^5.2.0
  just_audio: ^0.9.39
  permission_handler: ^11.3.1
  fl_chart: ^0.68.0
  excel: ^4.0.6
  share_plus: ^9.0.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  local_auth: ^2.2.0
  archive: ^3.6.1
  file_picker: ^8.0.7
  crypto: ^3.0.3
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

dependency_overrides:
  record_linux: ^1.3.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
